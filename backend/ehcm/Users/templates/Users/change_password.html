
{% extends "base.html" %}

{% block title %}Set Password{% endblock %}

{% block content %}

<div class="card">

    <h2>Set Your Password</h2>

    <p>
        You are logging in for the first time.
        Please replace your temporary password.
    </p>

    <p id="password-error" class="error" role="alert" hidden></p>
    <p id="password-success" class="success" role="status" hidden></p>

    <form id="password-form">

        {% csrf_token %}

        <label>Temporary / Current Password</label>

        <input
            type="password"
            name="current_password"
            required
        >

        <label>New Password</label>

        <input
            type="password"
            name="new_password"
            minlength="10"
            required
        >

        <label>Confirm New Password</label>

        <input
            type="password"
            name="confirm_password"
            minlength="10"
            required
        >

        <button type="submit">
            Set New Password
        </button>

    </form>

</div>

<script>
    const passwordForm = document.getElementById("password-form");
    const passwordError = document.getElementById("password-error");
    const passwordSuccess = document.getElementById("password-success");
    const accessToken = sessionStorage.getItem("ehcmAccessToken");

    if (!accessToken) {
        window.location.replace("/login/");
    }

    passwordForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        passwordError.hidden = true;
        passwordSuccess.hidden = true;

        const formData = new FormData(passwordForm);
        const newPassword = formData.get("new_password");

        if (newPassword !== formData.get("confirm_password")) {
            passwordError.textContent = "The new passwords do not match.";
            passwordError.hidden = false;
            return;
        }

        try {
            const response = await fetch("/api/auth/change-password/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${accessToken}`
                },
                body: JSON.stringify({
                    current_password: formData.get("current_password"),
                    new_password: newPassword,
                    confirm_password: formData.get("confirm_password")
                })
            });
            const result = await response.json();

            if (!response.ok) {
                const detail = result.error || Object.values(result).flat().join(" ");
                throw new Error(detail || "Unable to update the password.");
            }

            sessionStorage.setItem("ehcmAccessToken", result.access);
            sessionStorage.setItem("ehcmRefreshToken", result.refresh);
            sessionStorage.setItem("ehcmUser", JSON.stringify(result.user));
            window.location.assign(`/dashboard/${encodeURIComponent(result.role)}/`);
        } catch (error) {
            passwordError.textContent = error.message || "Unable to reach the server.";
            passwordError.hidden = false;
        }
    });
</script>

{% endblock %}
