
{% extends "base.html" %}

{% block title %}Set Password{% endblock %}

{% block content %}

<div class="card">

    <h2>Set Your Password</h2>

    <p>
        You are logging in for the first time.
        Please replace your temporary password.
    </p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>Temporary / Current Password</label>

        <input
            type="password"
            name="current_password"
            required
        >

        <label>New Password</label>

        <input
            type="password"
            name="new_password"
            minlength="10"
            required
        >

        <label>Confirm New Password</label>

        <input
            type="password"
            name="confirm_password"
            minlength="10"
            required
        >

        <button type="submit">
            Set New Password
        </button>

    </form>

</div>

{% endblock %}
