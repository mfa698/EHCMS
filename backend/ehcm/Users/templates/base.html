
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}EHCM System{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #263238;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0 16px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        button {
            background: #123c69;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0b2948;
        }

        .error {
            color: #c62828;
        }

        .success {
            color: #2e7d32;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

    <div class="container">

        {% if messages %}
            {% for message in messages %}
                <p class="{{ message.tags }}">
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}

    </div>

</body>
</html>
